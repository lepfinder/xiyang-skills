<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>__TITLE__</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- 公共样式与脚本依赖 -->
  <link rel="stylesheet" href="./diagram-base.css">
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" integrity="sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js" integrity="sha384-en/ztfPSRkGfME4KIm05joYXynqzUgbsG5nMrj/xEFAHXkeZfO3yMK8QQ+mP7p1/" crossorigin="anonymous"></script>
  <script src="./diagram-base.js" defer></script>
</head>
<body>

<div id="report-container" class="container">
  <header class="header">
    <div class="header-title-area">
      <!-- 状态指示灯，可以通过 style 覆盖颜色 (如 --accent-cyan, --accent-amber, --accent-emerald) -->
      <div class="pulsing-dot" style="background-color: var(--accent-cyan); box-shadow: 0 0 8px var(--accent-cyan);"></div>
      <div>
        <h1>__TITLE__</h1>
        <p>__SUBTITLE__</p>
      </div>
    </div>
    <div class="toolbar" id="diagram-toolbar">
      <button class="toolbar-toggle">⋯</button>
      <div class="toolbar-actions">
        <button class="toolbar-btn" data-action="copy">📋 复制 PNG 到剪贴板</button>
        <button class="toolbar-btn" data-action="png">🖼️ 下载高清 PNG</button>
        <button class="toolbar-btn" data-action="pdf">📄 导出为 PDF</button>
      </div>
    </div>
  </header>

  <div class="diagram-wrapper">
    <svg viewBox="0 0 1000 580" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0f172a" stroke-width="1"/>
        </pattern>
        <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#475569" />
        </marker>
      </defs>
      <rect width="100%" height="100%" fill="#020617"/>
      <rect width="100%" height="100%" fill="url(#grid)"/>

      <!-- 在此绘制您的组件与连接箭头 -->
      
    </svg>
  </div>

  <div class="info-grid">
    <div class="card">
      <div class="card-header">
        <div class="card-dot cyan"></div>
        <h3>分类标题</h3>
      </div>
      <ul>
        <li>• 描述细节项</li>
      </ul>
    </div>
  </div>

  <footer class="footer">
    <span>__FOOTER_METADATA__</span>
  </footer>
</div>

</body>
</html>
